name: Build macOS Apple Silicon

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/build-macos.yml"
      - "desktop/**"
      - "scripts/**"
      - "src/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"

permissions:
  contents: read

jobs:
  build-macos-arm64:
    runs-on: macos-15
    timeout-minutes: 30
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate source
        run: |
          npm run typecheck
          npm audit --omit=dev

      - name: Build arm64 DMG and ZIP
        run: npm run dist:mac

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v7
        with:
          name: RithumAuto-macOS-arm64
          path: |
            release/*.dmg
            release/*macOS*.zip
          if-no-files-found: error
          retention-days: 30
